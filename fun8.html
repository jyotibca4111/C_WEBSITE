   <h1>Make function for find out Cube a user entered number ?</h1>
   <p>
    #include &lt;stdio.h&gt;<br>
int cube(int n);<br>
int cube(int n)<br>
{<br>
return n*n*n;<br>
}<br>
void main()<br>
{<br>
int num,result;<br>
printf("Enter the number:");<br>
scanf("%d",&num);<br>
result=cube(num);<br>
printf("cube of %d is =%d\n",num,result);<br>
}<br>
