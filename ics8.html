<body>
   <h1>Enter a number from the user and print that number 100 time ?</h1>
   <p>
    #include&lt;stdio.h&gt;<br>
void main()<br>
{<br>
int num,i;<br>
printf("Enter a number:");<br>
scanf("%d",&num);<br>
for(i=0;i<100;i++)<br>
{<br>
printf("%d",num);<br>
}<br>
}<br>

   </p>
   <h2>
    Output:-
   </h2>
   <p>
enter a number:7<br>
7<br>
   </p>
