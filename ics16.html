<body>
   <h1>Enter a number from user and print total from 0 to that number ?</h1>
   <p>
    #include&lt;stdio.h&gt;<br>

void main()<br>
{<br>
    int n,i,sum=0;<br>

printf("enter a number:");<br>
scanf("%d",&n);<br>
        for(i=0;i<=n;i++)<br>
        {<br>
            sum=sum+i;<br>
        }<br>
printf("The total from 0 to %d is:%d\n",n,sum);<br>
}<br>

   </p>
   <h2>
    Output:-
   </h2>
   <p>
enter a number: 5<br>
total from 0 to 5 : 15<br>

   </p>
